name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vcsim:
        image: vmware/vcsim
        ports:
          - 8989:8989
        options: >-
          --health-cmd "curl -sk https://localhost:8989/about || true"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/vsphere_mcp/

      - name: Test
        env:
          VSPHERE_HOST: localhost
          VSPHERE_PORT: "8989"
          VSPHERE_USER: user
          VSPHERE_PASSWORD: pass
          VSPHERE_IGNORE_SSL: "true"
        run: uv run pytest tests/ -v --cov=vsphere_mcp --cov-report=term-missing
