[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsphere-mcp"
version = "0.1.0"
description = "MCP server for VMware vSphere / vCenter operations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Yuto Fukui" },
]
keywords = ["mcp", "vsphere", "vcenter", "vmware", "pyvmomi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "mcp>=1.0.0",
    "pyvmomi>=9.1.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.4.0", "pytest-cov>=5.0", "mypy>=1.0"]
metrics = ["prometheus-client>=0.20.0"]

[project.urls]
Homepage = "https://github.com/fukui-yuto/vsphere-mcp"
Repository = "https://github.com/fukui-yuto/vsphere-mcp"
Documentation = "https://github.com/fukui-yuto/vsphere-mcp#readme"
Issues = "https://github.com/fukui-yuto/vsphere-mcp/issues"
Changelog = "https://github.com/fukui-yuto/vsphere-mcp/blob/main/docs/CHANGELOG.md"

[project.scripts]
vsphere-mcp = "vsphere_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vsphere_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pyVmomi.*", "pyVim.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
