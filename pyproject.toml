[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsphere-mcp"
version = "0.1.0"
description = "MCP server for VMware vSphere / vCenter operations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Yuto Fukui" },
]
keywords = ["mcp", "vsphere", "vcenter", "vmware", "pyvmomi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0",
    "pyvmomi>=8.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.4.0"]

[project.scripts]
vsphere-mcp = "vsphere_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vsphere_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
